name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts -v
      - name: Validate cask syntax
        run: |
          if test -f Casks/wattop.rb; then
            ruby -c Casks/wattop.rb
          fi
      - name: Lint cask
        if: hashFiles('Casks/wattop.rb') != ''
        run: |
          brew update --quiet
          brew style Casks/wattop.rb
      - name: Install cask from this checkout
        if: hashFiles('Casks/wattop.rb') != ''
        run: |
          brew tap jasonm4130/wattop "$GITHUB_WORKSPACE"
          brew install --cask jasonm4130/wattop/wattop
          bin="$(brew --prefix)/bin/wattop"
          if xattr -p com.apple.quarantine "$bin" 2>/dev/null; then
            echo "quarantine still set on $bin"; exit 1
          fi
          "$bin" --version
