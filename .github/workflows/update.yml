name: update
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: update-tap
  cancel-in-progress: false
jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release and generate cask
        run: python3 scripts/update.py
      - name: Detect an update
        id: changed
        run: |
          if test -n "$(git status --porcelain -- Casks/wattop.rb)"; then
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install and test candidate
        if: steps.changed.outputs.update == 'true'
        run: |
          brew tap jasonm4130/wattop
          mkdir -p "$(brew --repository jasonm4130/wattop)/Casks"
          cp Casks/wattop.rb "$(brew --repository jasonm4130/wattop)/Casks/wattop.rb"
          brew install --cask jasonm4130/wattop/wattop
          wattop --version
      - name: Publish tested cask
        if: steps.changed.outputs.update == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/wattop.rb
          git commit -m 'chore: update wattop to the latest verified release'
          git push
